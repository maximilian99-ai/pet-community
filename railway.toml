[build]
builder = "NIXPACKS"
buildCommand = "pnpm --filter backend prisma:generate && pnpm --filter backend build"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
startCommand = "pnpm --filter backend start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "backend"

[services.variables]
NODE_ENV = "production"
PORT = "5001"
